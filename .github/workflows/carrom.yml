name: Play Carrom via Issues

on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  play-carrom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process Move & Redraw Board
        run: |
          # Fallback title if triggered manually via button
          python .github/scripts/carrom_engine.py "${{ github.event.issue.title || 'carrom:strike+center' }}"

      - name: Commit and Push Board State
        run: |
          git config --global user.name "carrom-bot"
          git config --global user.email "carrom-bot@users.noreply.github.com"
          git add images/carrom_board.svg README.md .github/carrom_state.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "game: executed carrom strike 🎯" && git push)

      - name: Close Issue Automatically (Only if triggered by issue)
        if: github.event_name == 'issues'
        uses: peter-evans/close-issue@v3
        with:
          comment: "🎯 Great shot! Your strike has been processed, the striker position updated, and your profile README has been refreshed."